[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-file-jail"
version = "0.1.0"
description = "Path traversal and symlink escape interceptor for local filesystem tool execution"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-file-jail = "agent_file_jail.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_file_jail*"]
